<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#234D38"/>
      <stop offset="100%" stop-color="#1A3A2A"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#9A7A45"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#C8A96E"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGrad)"/>

  <!-- Outer decorative rings -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#C8A96E" stroke-width="0.5" opacity="0.3"/>

  <!-- 8 outer green leaf petals -->
  <g transform="translate(250,250)">
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(0)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(45)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(90)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(135)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(180)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(225)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(270)"/>
    <path d="M0,-130 C18,-100 18,-70 0,-55 C-18,-70 -18,-100 0,-130Z" fill="#4A7A5E" transform="rotate(315)"/>
    <!-- Vein lines -->
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(0)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(45)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(90)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(135)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(180)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(225)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(270)"/>
    <line x1="0" y1="-128" x2="0" y2="-57" stroke="#7BAA8A" stroke-width="1" opacity="0.5" transform="rotate(315)"/>
  </g>

  <!-- 8 inner gold petals -->
  <g transform="translate(250,250)" filter="url(#glow)">
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(0)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(45)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(90)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(135)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(180)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(225)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(270)"/>
    <path d="M0,-75 C12,-55 12,-38 0,-28 C-12,-38 -12,-55 0,-75Z" fill="url(#goldGrad)" transform="rotate(315)"/>
  </g>

  <!-- Accent dots between petals -->
  <g transform="translate(250,250)" opacity="0.6">
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(22.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(67.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(112.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(157.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(202.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(247.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(292.5)"/>
    <circle cx="0" cy="-148" r="3" fill="#C8A96E" transform="rotate(337.5)"/>
  </g>

  <!-- Center jewel -->
  <circle cx="250" cy="250" r="26" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="18" fill="#1A3A2A"/>
  <circle cx="250" cy="250" r="10" fill="url(#goldGrad)"/>

  <!-- DUA GARDEN text -->
  <text x="250" y="390"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="400" letter-spacing="7"
        fill="#C8A96E">DUA GARDEN</text>

  <!-- Arabic subtitle -->
  <text x="250" y="422"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="17" letter-spacing="2"
        fill="#7BAA8A">حديقة الأدعية</text>

  <!-- Decorative line under text -->
  <line x1="145" y1="437" x2="355" y2="437" stroke="#C8A96E" stroke-width="0.8" opacity="0.4"/>
</svg>
