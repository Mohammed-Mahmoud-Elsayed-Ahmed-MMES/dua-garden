<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#234D38"/>
      <stop offset="100%" stop-color="#1A3A2A"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#9A7A45"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#C8A96E"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="232" fill="none" stroke="#C8A96E" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- 8 outer green leaf petals (larger for icon use) -->
  <g transform="translate(250,250)">
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(0)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(45)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(90)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(135)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(180)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(225)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(270)"/>
    <path d="M0,-155 C22,-118 22,-82 0,-65 C-22,-82 -22,-118 0,-155Z" fill="#4A7A5E" transform="rotate(315)"/>
    <!-- Vein lines -->
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(0)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(45)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(90)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(135)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(180)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(225)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(270)"/>
    <line x1="0" y1="-152" x2="0" y2="-68" stroke="#7BAA8A" stroke-width="1.2" opacity="0.6" transform="rotate(315)"/>
  </g>

  <!-- 8 inner gold petals -->
  <g transform="translate(250,250)" filter="url(#glow)">
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(0)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(45)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(90)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(135)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(180)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(225)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(270)"/>
    <path d="M0,-92 C15,-68 15,-46 0,-34 C-15,-46 -15,-68 0,-92Z" fill="url(#goldGrad)" transform="rotate(315)"/>
  </g>

  <!-- Accent dots -->
  <g transform="translate(250,250)" opacity="0.7">
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(22.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(67.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(112.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(157.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(202.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(247.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(292.5)"/>
    <circle cx="0" cy="-175" r="4" fill="#C8A96E" transform="rotate(337.5)"/>
  </g>

  <!-- Center jewel -->
  <circle cx="250" cy="250" r="32" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="22" fill="#1A3A2A"/>
  <circle cx="250" cy="250" r="12" fill="url(#goldGrad)"/>
</svg>
